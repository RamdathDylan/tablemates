# Continuous integration: every pull request and every push to main must pass
# these jobs. The workflow is also callable (workflow_call) so a deployment
# workflow can run it first and deploy only the artifacts it built.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# Least privilege: jobs only read the repository unless they say otherwise.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22.23.3'

jobs:
  checks:
    name: Typecheck and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Lint the app
        run: pnpm --filter @tablemates/mobile exec expo lint

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          POSTGRES_USER: tablemates
          POSTGRES_PASSWORD: tablemates
          POSTGRES_DB: tablemates_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tablemates" --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://tablemates:tablemates@localhost:5432/tablemates_test
      # Enables the test that shares rate limits across instances through Redis.
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # API integration tests against Postgres, then the design-token contrast check.
      - run: pnpm test

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Fails on any known advisory not reviewed in pnpm-workspace.yaml (auditConfig).
      - run: pnpm audit --audit-level low

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Blocks pull requests that add dependencies with known high-severity advisories.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Scans the full history so a secret can't hide in an earlier commit of the branch.
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner --exit-code 1

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint checks workflow syntax and shell scripts; zizmor checks for
      # GitHub Actions security problems such as injection and broad permissions.
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color=false
      - name: zizmor
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
          --offline .github/workflows

  build:
    name: Build artifacts
    needs: [checks, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The web app. Production values (API URL, Maps key) are supplied by the
      # deployment workflow; this build proves the bundle compiles.
      - name: Build the web app
        run: pnpm --filter @tablemates/mobile exec expo export --platform web --output-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-${{ github.sha }}
          path: apps/mobile/dist
          retention-days: 14

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t tablemates-api:${{ github.sha }} .
      - name: Smoke-test the API image
        run: |
          docker run -d --name api -p 127.0.0.1:4000:4000 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e DATABASE_URL=postgres://ci:ci-only@127.0.0.1:1/none \
            -e MAIL_PROVIDER=resend -e RESEND_API_KEY=ci-placeholder \
            -e S3_ENDPOINT=http://127.0.0.1:1 -e S3_ACCESS_KEY_ID=ci -e S3_SECRET_ACCESS_KEY=ci-placeholder \
            -e CORS_ORIGINS=https://app.example.com \
            tablemates-api:${{ github.sha }}
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4000/health && exit 0; sleep 1; done
          docker logs api
          exit 1
      # Fails on fixable high or critical vulnerabilities, or secrets, in the image.
      - name: Scan the API image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          tablemates-api:${{ github.sha }}
