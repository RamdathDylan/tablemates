# Local development services only. Credentials here are public development
# defaults; production uses managed services and its own secrets.
# Ports are published on 127.0.0.1 so nothing is reachable from other machines
# on your network. To test photo uploads from a phone, see docs/development.md.
# Images are pinned by digest so every machine runs exactly the same version.
services:
  db:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_USER: tablemates
      POSTGRES_PASSWORD: tablemates
      POSTGRES_DB: tablemates
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./apps/api/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tablemates']
      interval: 2s
      timeout: 3s
      retries: 20

  # Local email inbox: the API sends verification codes here in development.
  # Web UI and HTTP API at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - '127.0.0.1:8025:8025'

  # Local S3-compatible photo storage (production uses Cloudflare R2 through the same API).
  # The API creates the bucket and its CORS rule on startup. Console: http://localhost:9001
  storage:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: tablemates
      RUSTFS_SECRET_KEY: tablemates-dev
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - storage-data:/data

volumes:
  db-data:
  storage-data:
