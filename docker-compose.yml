services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tablemates
      POSTGRES_PASSWORD: tablemates
      POSTGRES_DB: tablemates
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./apps/api/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tablemates']
      interval: 2s
      timeout: 3s
      retries: 20

  # Local email inbox: the API sends verification codes here in development.
  # Web UI and HTTP API at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025'

  # Local S3-compatible photo storage (production uses Cloudflare R2 through the same API).
  # The API creates the bucket and its CORS rule on startup. Console: http://localhost:9001
  storage:
    image: rustfs/rustfs:latest
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: tablemates
      RUSTFS_SECRET_KEY: tablemates-dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage-data:/data

volumes:
  db-data:
  storage-data:
